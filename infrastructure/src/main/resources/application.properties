quarkus.application.name=cv-api

quarkus.smallrye-openapi.path=/openapi.json
mp.openapi.filter=dev.julioflores.cv.infrastructure.adapter.in.rest.OpenApiResponseFilter
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true

# Tope duro de memoria por petición. Es global en Quarkus, así que se sube a lo que necesita la subida de imágenes (5 MB + multipart)
# y RequestBodyLimits lo recorta a cv.http.max-body-size en todo lo demás (HL7, contacto, resto del admin). Ver la subida de imágenes más abajo.
quarkus.http.limits.max-body-size=6M
# Cuerpo máximo de cualquier ruta que no sea la subida de imágenes (bytes). El límite funcional de la demo HL7 (64 KB) lo aplica la aplicación.
cv.http.max-body-size=131072

quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/

# Cobertura: solo las clases propias de este módulo. domain/application ya se miden con sus pruebas unitarias;
# si no, aparecerían con 0% porque Quarkus las carga en otro cargador de clases.
quarkus.jacoco.includes=dev/julioflores/cv/infrastructure/**

# Base de datos. En test y dev, Quarkus levanta un PostgreSQL con Testcontainers (hace falta Docker).
# En producción se configura con QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME y QUARKUS_DATASOURCE_PASSWORD.
quarkus.datasource.db-kind=postgresql
# Si la base de datos no responde, fallar pronto (se sirve el último CV leído) en vez de colgar la petición.
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.flyway.migrate-at-start=true
# El contenido del CV puede llevar `${...}`; no usamos marcadores de Flyway.
quarkus.flyway.placeholder-replacement=false

# Cuánto tiempo se reutiliza el CV leído de la base de datos antes de volver a consultarlo.
cv.resume.cache-ttl=PT5M
# Las pruebas cargan además un CV ficticio (db/sample, ver su README).
%test.quarkus.flyway.locations=db/migration,db/testdata

# Contacto: sal para el hash de la IP del remitente (en producción, una cadena larga y secreta propia) y límite de envíos por remitente.
cv.contact.ip-salt=${CV_CONTACT_IP_SALT:dev-only-salt}
cv.contact.rate-limit.max=5
cv.contact.rate-limit.window=PT1H
# Aviso por Telegram de cada mensaje nuevo (bot de @BotFather y el id del chat). Si falta alguno, no se avisa.
cv.contact.telegram.bot-token=${CV_CONTACT_TELEGRAM_BOT_TOKEN:}
cv.contact.telegram.chat-id=${CV_CONTACT_TELEGRAM_CHAT_ID:}
%test.cv.contact.rate-limit.max=3

# Servicios, proyectos y arquitectura (tabla content_version): cuánto se reutiliza lo leído antes de volver a consultar.
cv.content.cache-ttl=PT5M

# ── Imágenes en Cloudflare R2 (API S3). Todo por entorno; vacío = la subida responde 503 IMAGE_STORAGE_UNAVAILABLE y la API arranca igual ──
cv.r2.endpoint=${R2_ENDPOINT:}
cv.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cv.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cv.r2.bucket=${R2_BUCKET_NAME:}
# Dominio público del bucket, sin barra final (de aquí salen las `images[].url` del GET público).
cv.r2.public-url=${R2_PUBLIC_URL:}
cv.r2.connect-timeout=PT5S
cv.r2.request-timeout=PT10S
# La subida es multipart: los archivos van a disco (no a memoria) y se borran al terminar la petición.
quarkus.http.body.delete-uploaded-files-on-end=true
%test.cv.r2.public-url=https://media.example.test
%test.quarkus.http.body.uploads-directory=target/test-uploads

# ── Administración (solo existe si hay un secreto JWT válido: ≥ 32 caracteres, por entorno) ──────────────────────────
# Sin CV_ADMIN_JWT_SECRET la API arranca igual, los endpoints públicos funcionan y /api/v1/admin responde 404/401.
# cv.admin.jwt.secret llega por entorno (CV_ADMIN_JWT_SECRET). No se declara aquí: ausente o vacío = admin deshabilitado.
cv.admin.session.lifespan=${CV_ADMIN_SESSION_LIFESPAN:PT8H}
cv.admin.login.max-failures=${CV_ADMIN_LOGIN_MAX_FAILURES:5}
cv.admin.login.lock=${CV_ADMIN_LOGIN_LOCK:PT15M}
# Límite global (una sola clave): 10 intentos de login por minuto en total.
cv.admin.login.rate-limit.max=10
cv.admin.login.rate-limit.window=PT1M
# Defensa en profundidad: 404 a toda petición admin que traiga cabeceras de Cloudflare (CF-Ray, CF-Connecting-IP).
cv.admin.edge-block=${CV_ADMIN_EDGE_BLOCK:false}
# Contenido editable: tope del cuerpo de un guardado (ES + EN). Más grande: 413 CONTENT_TOO_LARGE. Por debajo del tope duro de
# memoria (quarkus.http.limits.max-body-size = 128K), para que el rechazo salga como un problema y no como un corte.
cv.admin.content.max-bytes=${CV_ADMIN_CONTENT_MAX_BYTES:98304}
# Argon2id: memoria en KiB, iteraciones y paralelismo. Van dentro del hash, así que se pueden subir sin romper los antiguos.
cv.admin.argon2.memory-kib=65536
cv.admin.argon2.iterations=3
cv.admin.argon2.parallelism=1
# Verificación del JWT (HS256, la misma clave que firma).
# smallrye.jwt.verify.secretkey lo calcula AdminJwtKeyConfigInterceptor a partir de cv.admin.jwt.secret (SmallRye pide un JWK).
# NONE: sin esto Quarkus inventa un par de claves RSA en dev/test, que tendría prioridad sobre el secreto.
mp.jwt.verify.publickey=NONE
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=cv-api
mp.jwt.verify.audiences=cv-admin
# Autenticación diferida: así los fallos de sesión pasan por los mapeadores de excepciones y salen como problem+json.
quarkus.http.auth.proactive=false
# Todo lo de /api/v1/admin exige sesión, salvo el login.
quarkus.http.auth.permission.admin-login.paths=/api/v1/admin/auth/login
quarkus.http.auth.permission.admin-login.policy=permit
quarkus.http.auth.permission.admin-login.applies-to=JAXRS
quarkus.http.auth.permission.admin.paths=/api/v1/admin/*
quarkus.http.auth.permission.admin.policy=authenticated
quarkus.http.auth.permission.admin.applies-to=JAXRS
# Tolerancia de reloj mínima (por defecto SmallRye admite 60 s de token caducado).
smallrye.jwt.expiration.grace=0
mp.jwt.verify.clock.skew=5
# Pruebas: secreto de test (no es un secreto real), hash barato y sin límite global (las pruebas hacen muchos logins).
%test.cv.admin.jwt.secret=test-only-secret-0123456789-abcdefghijklmnopqrstuv
%test.cv.admin.argon2.memory-kib=1024
%test.cv.admin.argon2.iterations=1
%test.cv.admin.login.rate-limit.max=100000

# ── Logs ──────────────────────────────────────────────────────────
# Producción: una línea JSON por registro; el MDC (request_id, client_ip, error_code) sale como campos planos y service=cv-api.
# Dev y test: texto con el request_id entre corchetes.
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.json.additional-field."service".value=cv-api
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,processName,processId,threadId,hostName,ndc
quarkus.log.console.json.key-overrides=LOGGER_NAME=logger
# La traza sale como un solo campo de texto (`stackTrace`), no como un objeto de marcos.
quarkus.log.console.json.exception-output-type=formatted
%dev.quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%X{request_id}] %c{1.} %s%e%n
%test.quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%X{request_id}] %c{1.} %s%e%n
# Access log integrado de Quarkus (categoría `access`): ve también los 404 de enrutado y el 413 de RequestBodyLimits. Nunca lleva query,
# cabeceras ni IP en rutas públicas (%q, %r, %U, %h, %a y %{i,..} están prohibidos: %U incluye la query; la ruta sin query es %R); la IP solo entra por el MDC, que solo rellena el handler en /api/v1/admin.
quarkus.http.record-request-start-time=true
quarkus.http.access-log.enabled=true
quarkus.http.access-log.category=access
quarkus.http.access-log.pattern=%m %R %s %Dms %Bb rid=%{X,request_id} err=%{X,error_code} ip=%{X,client_ip}
quarkus.http.access-log.exclude-pattern=^/(q/health|swagger|q/swagger-ui|openapi\\.json).*
