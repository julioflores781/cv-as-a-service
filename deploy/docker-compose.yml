# API + PostgreSQL para el NAS. Está pensado para pegarse tal cual en el editor de "Compose config" del NAS:
# sin archivo .env ni variables externas. Cambia los valores marcados con CAMBIA.
services:
  cv-db:
    image: postgres:16-alpine
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: CAMBIA-esta-contrasena
    volumes:
      - cv-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin "ports": solo la API (misma red del compose) llega a la base de datos.

  cv-api:
    image: julioflores781/cv-api:latest
    container_name: cv-api
    restart: unless-stopped
    depends_on:
      cv-db:
        condition: service_healthy
    ports:
      - "8085:8080" # CAMBIA 8085 por un puerto libre del NAS; es el que apuntará el túnel de Cloudflare
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://cv-db:5432/cv
      QUARKUS_DATASOURCE_USERNAME: cv
      QUARKUS_DATASOURCE_PASSWORD: CAMBIA-esta-contrasena # la misma que POSTGRES_PASSWORD
      # Orígenes de la web que llamará a la API desde el navegador (separados por coma). Sin esto el CORS bloquea todo.
      QUARKUS_HTTP_CORS_ORIGINS: https://CAMBIA.tu-dominio.com
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  cv-db:
